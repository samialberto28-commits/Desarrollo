<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora JS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Calculadora básica">
      <h1>Calculadora</h1>
      <input id="display" class="display" type="text" value="0" readonly aria-label="Pantalla" />
      <div class="keys">
        <button data-action="clear" class="span-2">C</button>
        <button data-action="delete">⌫</button>
        <button data-value="/">÷</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button data-value="*">×</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-value="-">−</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-value="+">+</button>

        <button data-value="0" class="span-2">0</button>
        <button data-value=".">.</button>
        <button data-action="equals">=</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
